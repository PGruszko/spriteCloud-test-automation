name: Run API Test with Newman

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    postman-newman-run:
        runs-on: ubuntu-latest
        permissions:
         actions: read
         contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Use Node.js 22
              uses: actions/setup-node@v2
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm install

            - name: Check if ReqRes site is accessible
              run: curl -I https://reqres.in

            - name: Run Postman collection with Newman
              run: npm run run-test

            - name: Create CTRF json report
              run: npm run run-ctrf-report

            - name: Publish CTRF API Tests Report
              uses: ctrf-io/github-test-reporter@v1
              with:
                report-path: './ctrf/ctrf-report.json'
                suite-folded-report: true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              if: always()